[project]
name = "workshop-signup-bot"
version = "1.0"
description = "Telegram bot for workshop signups and event management"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.15.0",
    "peewee>=3.17.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff.lint]
ignore = ["E712"]  # Peewee ORM requires == True/False for SQL expressions
